name: Cloudflare Gateway Adblock Updater

on:
  schedule:
    - cron: '0 */3 * * *'  # Runs every 3 hours
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no changes made to Cloudflare)'
        type: boolean
        default: false
      fresh_start:
        description: 'Fresh start (delete and rebuild all lists/policies)'
        type: boolean
        default: false

# Never let two runs modify the account at the same time
concurrency:
  group: cloudflare-gateway-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Cache pip packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-requests-aiohttp
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests aiohttp

      - name: Run update script
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CHECK_VERSIONS: 'true'
          FRESH_START: ${{ inputs.fresh_start == true && 'true' || 'false' }}
          DRY_RUN: ${{ inputs.dry_run == true && 'true' || 'false' }}
          # Optional notifications (add the secrets you want; leave the rest unset)
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NOTIFY_ON_SUCCESS: 'false'
        run: python update_gateway.py
